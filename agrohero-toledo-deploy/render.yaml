services:
  # Backend API Node.js / Express
  - type: web
    name: agro-hero-api
    env: node
    plan: free
    region: ohio
    rootDir: agrohero-toledo-deploy
    buildCommand: npm install && npm run build
    startCommand: npm run start:server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: agro-hero-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false
      - key: AUTH0_ISSUER_URL
        sync: false
      - key: AUTH0_AUDIENCE
        sync: false
      - key: AUTH0_ROLES_CLAIM
        value: https://agrohero.app/roles
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false
      - key: CHECKOUT_BASE_URL
        sync: false

databases:
  # PostgreSQL gerenciado no Render
  - name: agro-hero-db
    plan: free
    region: ohio
    databaseName: agro_hero
    user: agro_hero_user
