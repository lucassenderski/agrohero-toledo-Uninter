services:
  # Backend API Node.js / Express
  - type: web
    name: agro-hero-api
    env: node
    plan: free
    region: ohio
    buildCommand: npm install && npm run build
    startCommand: npm run start:server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: agro-hero-db
          property: connectionString
      - key: CORS_ORIGIN
        value: https://agro-hero.vercel.app

databases:
  # PostgreSQL gerenciado no Render
  - name: agro-hero-db
    plan: free
    region: ohio
    databaseName: agro_hero
    user: agro_hero_user
